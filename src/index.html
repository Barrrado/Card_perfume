<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0"> <!-- displays site properly based on user's device -->
  <link rel="stylesheet" href="../build/css/main.css">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,100..900;1,9..144,100..900&family=Montserrat:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
  <link rel="icon" type="image/png" sizes="32x32" href="./images/favicon-32x32.png">
  <title>Frontend Mentor | Product preview card component</title>
  <!-- Feel free to remove these styles or customise in your own stylesheet 👍 -->
  <style>
    .attribution { font-size: 11px; text-align: center; }
    .attribution a { color: hsl(228, 45%, 44%); }
  </style>
</head>
<body>
<section class="conteiner">
  <div class="conteiner__img">
    <img  class="img__desktop" src="./images/image-product-desktop.jpg" alt="Perfumer-Creator">
    <img class="img__mobile" src="./images/image-product-mobile.jpg" alt="Perfumer-Creator">
  </div> 
  <div class="conteiner__text">
    <h5>P e r f u m e</h5>
    <h1>Gabrielle Essence Eau De Parfum</h1>
    <div class="conteiner__descrição">
        <p>A floral, solar and voluptuous</p>
        <p>interpretation composed by</p>
        <p>Olivier Polge, Perfumer-Creator</p>
        <p>for the House of CHANEL.</p>
    </div>
    <div class="conteiner__price">
      <h2>$149.99</h2>  
      <h6>$169.99</h6>
    </div>
    <button>
  <img class="icon" src="./images/icon-cart.svg" alt="">
      Add to Cart</button>
  </div>
</section>

  <div class="attribution">
    Challenge by <a href="https://www.frontendmentor.io?ref=challenge" target="_blank">Frontend Mentor</a>. 
    Coded by <a href="#">Your Name Here</a>.
  </div>
</body>
</html>
